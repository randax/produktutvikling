<style>

:root { --bg: #EEF0F1; --ink: #17223A; --muted: #556074; --line: #D6DAE0; --amber: #A9620F;

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1522; --ink: #E8EBF0; --muted: #9AA5B8; --line: #27334B; --amber: #F0A43A; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0E1522; --ink: #E8EBF0; --muted: #9AA5B8; --line: #27334B; --amber: #F0A43A; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
h1 { font-family: var(--display); font-size: clamp(30px, 4.5vw, 46px); margin: 0; line-height: 1.1; }
.lede { color: var(--muted); max-width: 64ch; line-height: 1.6; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
figure.wide { grid-column: 1 / -1; }
.img { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.img img { display: block; width: 100%; height: auto; }
.cap { position: absolute; left: 10px; bottom: 10px; font-size: 12px; background: rgba(0,0,0,.5); color: #fff; padding: 2px 8px; border-radius: 6px; }
figcaption { font-size: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
figcaption b { font-family: var(--display); font-size: 17px; }
figcaption span { color: var(--muted); }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
